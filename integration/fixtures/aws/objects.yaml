  name: karpenter
  namespace: integration-tests
  labels:
    app.kubernetes.io/name: karpenter
    app.kubernetes.io/instance: karpenter
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: karpenter
      app.kubernetes.io/instance: karpenter
