# The objects of the AWS session: self-hosted Karpenter with two EC2NodeClasses,
# without nodes. The events carry no timestamps, so the API server dates them
# when they are applied. The controller Deployment is scaled to zero; the
# dashboard reads the version from its image.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: KarpenterNodeRole-lab
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: lab
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: lab
  kubelet:
    maxPods: 58
  tags:
    team: platform
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
spec:
  role: KarpenterNodeRole-lab
  amiFamily: Bottlerocket
  amiSelectorTerms:
    - alias: bottlerocket@latest
  subnetSelectorTerms:
    - id: subnet-0a1b2c3d4e5f60001
  securityGroupSelectorTerms:
    - id: sg-0a1b2c3d4e5f60001
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: [spot, on-demand]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: [c, m]
      expireAfter: 720h
  limits:
    cpu: "64"
    memory: 256Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
spec:
  weight: 50
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu
      requirements:
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: [g5]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
      taints:
        - key: nvidia.com/gpu
          effect: NoSchedule
      expireAfter: Never
  limits:
    cpu: "32"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 10m
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: empty
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
      expireAfter: 720h
  limits:
    cpu: "16"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
---
apiVersion: karpenter.sh/v1alpha1
kind: NodeOverlay
metadata:
  name: spot-discount
spec:
  weight: 10
  requirements:
    - key: karpenter.sh/capacity-type
      operator: In
      values: [spot]
  priceAdjustment: -10%
---
apiVersion: karpenter.sh/v1alpha1
kind: NodeOverlay
metadata:
  name: gpu-fpga
spec:
  weight: 50
  requirements:
    - key: karpenter.sh/nodepool
      operator: In
      values: [gpu]
  capacity:
    example.com/fpga: "1"
---
