---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karpenter
  namespace: integration-tests
  labels:
    app.kubernetes.io/name: karpenter
    app.kubernetes.io/instance: karpenter
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: karpenter
      app.kubernetes.io/instance: karpenter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: karpenter
        app.kubernetes.io/instance: karpenter
    spec:
      containers:
        - name: karpenter
          image: public.ecr.aws/cloudpilotai/gcp/karpenter:v0.6.1
