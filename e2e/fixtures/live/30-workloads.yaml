apiVersion: apps/v1
kind: Deployment
metadata:
  name: inflate
  namespace: lab-workloads
spec:
  replicas: 0
  selector:
    matchLabels:
      app: inflate
  template:
    metadata:
      labels:
        app: inflate
    spec:
      terminationGracePeriodSeconds: 0
      nodeSelector:
        karpenter.sh/nodepool: general
      containers:
        - name: inflate
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inflate-batch
  namespace: lab-workloads
spec:
  replicas: 0
  selector:
    matchLabels:
      app: inflate-batch
  template:
    metadata:
      labels:
        app: inflate-batch
    spec:
      terminationGracePeriodSeconds: 0
      nodeSelector:
        karpenter.sh/nodepool: batch
      tolerations:
        - key: dedicated
          value: batch
          effect: NoSchedule
      containers:
        - name: inflate
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
